name: Test against Deno Deploy

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Get Deno Deploy URL
        id: get-url
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OUTPUT=$(node scripts/get-deno-url.js)
          echo "$OUTPUT"
          URL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^DEPLOYMENT_URL_OUTPUT=//p')
          test -n "$URL"
          echo "TEST_HOST=$URL" >> $GITHUB_ENV
          echo "deployment_url=$URL" >> $GITHUB_OUTPUT

      - name: Seed E2E plan
        run: |
          OUTPUT=$(SEED_BASE_URL="$TEST_HOST" pnpm seed:plan)
          echo "$OUTPUT"
          PLAN_URL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^SEED_PLAN_URL=//p')
          echo "E2E_PLAN_URL=$PLAN_URL" >> "$GITHUB_ENV"
          {
            echo "## Seeded E2E plan"
            echo "[Open the seeded plan]($PLAN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run Vitest tests
        run: pnpm test

      - name: Run Accessibility tests
        run: pnpm test:a11y
