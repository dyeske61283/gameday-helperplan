name: Test against Deno Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Get Deno Deploy URL
        id: get-url
        env:
          DENO_PROJECT_ID: ${{ secrets.DENO_PROJECT_ID }}
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          # Wait a bit for the deployment to start/finish if triggered by the same push
          sleep 10
          URL=$(node scripts/get-deno-url.js)
          echo "TEST_HOST=$URL" >> $GITHUB_ENV
          echo "deployment_url=$URL" >> $GITHUB_OUTPUT

      - name: Run Vitest tests
        run: pnpm test
        env:
          TEST_HOST: ${{ env.TEST_HOST }}

      - name: Run Accessibility tests
        run: pnpm test:a11y
        env:
          TEST_HOST: ${{ env.TEST_HOST }}
