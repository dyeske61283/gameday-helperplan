name: Test against Deno Deploy

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Get Deno Deploy URL
        id: get-url
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OUTPUT=$(node scripts/get-deno-url.js)
          echo "$OUTPUT"
          URL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^DEPLOYMENT_URL_OUTPUT=//p')
          test -n "$URL"
          echo "TEST_HOST=$URL" >> $GITHUB_ENV
          echo "deployment_url=$URL" >> $GITHUB_OUTPUT

      - name: Seed isolated E2E plans
        run: |
          seed_plan() {
            SEED_BASE_URL="$TEST_HOST" \
            SEED_PLAN_ID="$(node -e 'console.log(require("node:crypto").randomUUID())')" \
            pnpm seed:plan | sed -n 's/^SEED_PLAN_URL=//p'
          }
          echo "E2E_WORKFLOW_PLAN_URL=$(seed_plan)" >> "$GITHUB_ENV"
          echo "E2E_ROUTING_PLAN_URL=$(seed_plan)" >> "$GITHUB_ENV"
          echo "E2E_EDIT_PLAN_URL=$(seed_plan)" >> "$GITHUB_ENV"
          {
            echo "## E2E test data"
            echo "Seeded independent workflow, routing/sharing, and editing plans."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run Vitest tests
        run: pnpm test

      - name: Run Accessibility tests
        run: pnpm test:a11y
